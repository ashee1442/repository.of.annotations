<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotatsiya hisoboti</title>
<style>
  :root {
    --bg: #faf6f0; --panel: #fffdf9; --text: #2e2620; --muted: #7d6f63; --line: #ece2d6;
    --accent: #b35a2b; --accent-soft: #f6e8dc; --on-accent: #ffffff;
    --good: #7a8f3e; --warn: #d39a3a; --bad: #c0563f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1915; --panel: #27211c; --text: #f2e9df; --muted: #a8998b; --line: #3a3029;
      --accent: #e29a64; --accent-soft: #3a2b20; --on-accent: #1d1915;
      --good: #a5b765; --warn: #e6b45c; --bad: #e07a62;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); margin-top: 2px; }
  .btn { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  #drop { margin-top: 20px; border: 2px dashed var(--line); border-radius: 14px; background: var(--panel);
          padding: 56px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop b { display: block; font-size: 16px; margin-bottom: 6px; }
  #drop span { color: var(--muted); }
  .privacy { color: var(--muted); font-size: 12px; margin-top: 10px; text-align: center; }
  .error { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 14%, transparent);
           color: var(--bad); display: none; }
  .hidden { display: none !important; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; word-break: break-word; }
  .card .v.small { font-size: 15px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel h2 { font-size: 15px; margin: 0; }
  .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .progress-meta { display: flex; justify-content: space-between; color: var(--muted); margin-top: 8px; flex-wrap: wrap; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: var(--text); padding: 6px 12px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .top { display: grid; gap: 6px; }
  .top .row { display: grid; grid-template-columns: minmax(0, 280px) minmax(60px, 1fr) 64px; gap: 10px; align-items: center; }
  .top .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  @media (max-width: 600px) { .top .row { grid-template-columns: minmax(0, 1.4fr) minmax(50px, 1fr) 56px; } .card .v { font-size: 19px; } }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:disabled { opacity: .5; cursor: not-allowed; }
  .export { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .export label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .export input { width: 90px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); font: inherit; }
  .export .count { color: var(--muted); flex: 1 1 200px; }
  .export .count b { color: var(--text); }
  .tabs { display: flex; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
  .tab { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
         color: var(--text); cursor: pointer; font: inherit; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
                   background: var(--bg); color: var(--text); font: inherit; }
  .toolbar input { flex: 1 1 220px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .toolbar .count, .note { color: var(--muted); }
  .note { margin-top: 10px; font-size: 12px; }
  .scroll { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none; font-weight: 600;
       box-shadow: 0 1px 0 var(--line); z-index: 1; }
  th:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  td.num, th.num { text-align: right; }
  td.sorted { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  tbody tr:hover td { background: var(--accent-soft); }
  td.rank { color: var(--muted); width: 1%; }
  .pct { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .pct .bar { width: 80px; height: 6px; }
  .pct .bar > i.good { background: var(--good); } .pct .bar > i.warn { background: var(--warn); } .pct .bar > i.bad { background: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Annotatsiya hisoboti</h1>
      <div class="sub" id="subtitle">annotation-all-YYYY-MM-DD.xlsx faylini oching</div>
    </div>
    <button class="btn hidden" id="another">Boshqa fayl ochish</button>
  </header>

  <input type="file" id="file" accept=".xlsx" hidden>
  <div id="drop"><b>Excel faylni shu yerga tashlang</b><span>yoki .xlsx faylni tanlash uchun bosing</span></div>
  <div class="privacy" id="privacy">Fayl faqat brauzeringizda o‘qiladi va hech qayerga yuklanmaydi.</div>
  <div class="error" id="error"></div>

  <div id="report" class="hidden">
    <div class="cards" id="cards"></div>
    <div class="panel hidden" id="progressPanel">
      <div class="panel-head"><h2>Korpus bajarilishi</h2></div>
      <div class="bar"><i id="progressBar"></i></div>
      <div class="progress-meta" id="progressMeta"></div>
    </div>
    <div class="panel hidden" id="topPanel">
      <div class="panel-head"><h2 id="topTitle">Top 10</h2><div class="seg" id="topMetric"></div></div>
      <div class="top" id="top"></div>
    </div>
    <div class="panel hidden" id="exportPanel">
      <div class="panel-head"><h2>Vaqti bo‘yicha alohida Excel</h2></div>
      <div class="export">
        <label>Minimal soat: <input id="minHours" type="number" step="0.01" min="0" value="2.00"></label>
        <span class="count" id="exportCount"></span>
        <button class="btn primary" id="exportBtn">⬇ Excel yuklab olish</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Ism, ID yoki istalgan qiymat bo‘yicha qidirish…">
        <label>Saralash: <select id="sortBy"></select></label>
        <button class="btn" id="sortDir" title="Saralash yo‘nalishini o‘zgartirish"></button>
        <span class="count" id="count"></span>
      </div>
      <div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   1. Reading the .xlsx in the browser (zip + XML, no libraries)
   ================================================================ */

async function unzip(buffer) {
  const view = new DataView(buffer), bytes = new Uint8Array(buffer);
  // Find the "end of central directory" record (signature 0x06054b50) near the end of the file.
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Bu yaroqli .xlsx fayl emas.');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const decoder = new TextDecoder();
  const files = {};
  for (let n = 0; n < count; n++) {
    if (view.getUint32(p, true) !== 0x02014b50) throw new Error('.xlsx fayl shikastlangan.');
    const method = view.getUint16(p + 10, true);
    const size = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true), extraLen = view.getUint16(p + 30, true), commentLen = view.getUint16(p + 32, true);
    const local = view.getUint32(p + 42, true);
    const name = decoder.decode(bytes.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (!/[.](xml|rels)$/.test(name)) continue;
    const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
    const data = bytes.subarray(start, start + size);
    if (method === 0) files[name] = decoder.decode(data);
    else if (method === 8) {
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      files[name] = await new Response(stream).text();
    }
  }
  return files;
}

const parseXml = s => new DOMParser().parseFromString(s, 'application/xml');
const tags = (node, name) => Array.from(node.getElementsByTagNameNS('*', name));
const textOf = el => tags(el, 't').map(t => t.textContent).join('');

function isDateFormat(id, code) {
  if ((id >= 14 && id <= 22) || (id >= 45 && id <= 47)) return true;
  if (!code) return false;
  const c = code.replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '').toLowerCase();
  return !c.includes('%') && (c.includes('yy') || c.includes('dd') || c.includes('h:mm') || c.includes('mm:ss'));
}

function excelDate(serial) {
  const ms = Math.round(serial * 86400) * 1000;
  const d = new Date(Date.UTC(1899, 11, 30) + ms);
  const pad = x => String(x).padStart(2, '0');
  const day = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  return ms % 86400000 === 0 ? day : day + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
}

function columnIndex(ref) {
  let col = 0;
  for (const ch of ref) {
    if (ch < 'A' || ch > 'Z') break;
    col = col * 26 + (ch.charCodeAt(0) - 64);
  }
  return col - 1;
}

async function readXlsx(buffer) {
  const files = await unzip(buffer);
  if (!files['xl/workbook.xml']) throw new Error('Bu yaroqli .xlsx fayl emas.');

  const shared = files['xl/sharedStrings.xml'] ? tags(parseXml(files['xl/sharedStrings.xml']), 'si').map(textOf) : [];

  const dateStyles = [];
  if (files['xl/styles.xml']) {
    const st = parseXml(files['xl/styles.xml']);
    const custom = {};
    tags(st, 'numFmt').forEach(f => custom[+f.getAttribute('numFmtId')] = f.getAttribute('formatCode'));
    const xfs = tags(st, 'cellXfs')[0];
    if (xfs) tags(xfs, 'xf').forEach(xf => {
      const id = +(xf.getAttribute('numFmtId') || 0);
      dateStyles.push(isDateFormat(id, custom[id]));
    });
  }

  const rels = {};
  if (files['xl/_rels/workbook.xml.rels']) {
    tags(parseXml(files['xl/_rels/workbook.xml.rels']), 'Relationship').forEach(r => {
      let t = r.getAttribute('Target');
      t = t.startsWith('/') ? t.slice(1) : (t.startsWith('xl/') ? t : 'xl/' + t);
      rels[r.getAttribute('Id')] = t;
    });
  }

  const sheets = [];
  tags(parseXml(files['xl/workbook.xml']), 'sheet').forEach((s, i) => {
    const rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    const xml = files[rels[rid] || 'xl/worksheets/sheet' + (i + 1) + '.xml'];
    if (!xml) return;
    const rows = [];
    tags(parseXml(xml), 'row').forEach(row => {
      const out = [];
      let auto = 0;
      tags(row, 'c').forEach(c => {
        const ref = c.getAttribute('r');
        const col = ref ? columnIndex(ref) : auto;
        auto = col + 1;
        const type = c.getAttribute('t') || 'n';
        const v = tags(c, 'v')[0];
        const raw = v ? v.textContent : null;
        let value = null;
        if (type === 'inlineStr') { const is = tags(c, 'is')[0]; value = is ? textOf(is) : null; }
        else if (type === 's') value = raw === null ? null : (shared[+raw] ?? null);
        else if (type === 'str' || type === 'e') value = raw;
        else if (type === 'b') value = raw === null ? null : raw.trim() === '1';
        else if (raw !== null && raw.trim() !== '') {
          const num = Number(raw);
          const style = +(c.getAttribute('s') || 0);
          value = dateStyles[style] ? excelDate(num) : Number(num.toPrecision(12)); // 99.90000000000001 -> 99.9
        }
        out[col] = value;
      });
      for (let k = 0; k < out.length; k++) if (out[k] === undefined) out[k] = null;
      if (out.some(x => x !== null && x !== '')) rows.push(out);
    });
    sheets.push({ name: s.getAttribute('name'), rows });
  });
  return { sheets };
}

/* ================================================================
   2. Page
   ================================================================ */

const $ = id => document.getElementById(id);
const fileInput = $('file'), drop = $('drop');
let tables = [], current = 0, sortCol = -1, sortDir = 1, topCol = -1;

drop.onclick = () => fileInput.click();
$('another').onclick = () => fileInput.click();
fileInput.onchange = () => fileInput.files[0] && openFile(fileInput.files[0]);
['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => ev.dataTransfer.files[0] && openFile(ev.dataTransfer.files[0]));

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, {maximumFractionDigits: 2});
  return String(v);
}
// Uzbek names for labels that come from the Excel file (the file itself stays in English).
const UZ = {
  'Summary': 'Umumiy', 'Totals': 'Annotatorlar',
  'Clips': 'Kliplar', 'Change vs previous': 'Oldingi davrga nisbatan', 'Hours': 'Soatlar',
  'Active annotators': 'Faol annotatorlar', 'Corpus assigned': 'Korpus: biriktirilgan',
  'Corpus done': 'Korpus: bajarilgan', 'Corpus remaining': 'Korpus: qolgan',
  'Annotator': 'Annotator', 'Assigned': 'Biriktirilgan', 'Done': 'Bajarilgan',
  'Remaining': 'Qolgan', '% done': 'Bajarilgan %'
};
const tr = s => UZ[String(s).trim()] ?? s;
const trValue = s => String(s).replace(/^All time/i, 'Butun davr');
const isPctHeader = h => /%|percent/i.test(String(h));

async function openFile(file) {
  $('error').style.display = 'none';
  drop.querySelector('b').textContent = file.name + ' o‘qilmoqda…';
  try {
    if (typeof DecompressionStream === 'undefined') throw new Error('Brauzeringiz eskirgan, .xlsx faylni o‘qiy olmaydi. Iltimos, brauzerni yangilang.');
    render(file.name, await readXlsx(await file.arrayBuffer()));
  } catch (e) {
    $('error').textContent = e.message || 'Faylni o‘qib bo‘lmadi.';
    $('error').style.display = 'block';
  } finally {
    drop.querySelector('b').textContent = 'Excel faylni shu yerga tashlang';
    fileInput.value = '';
  }
}

function render(fileName, data) {
  const kv = {}; tables = [];
  for (const sh of data.sheets) {
    const rows = sh.rows;
    if (!rows.length) continue;
    const width = Math.max(...rows.map(r => r.length));
    // A sheet of label/value pairs is the summary; anything wider is a table.
    const isSummary = width <= 2 && rows.every(r => typeof r[0] === 'string');
    if (isSummary) rows.forEach(r => kv[r[0]] = r.length > 1 ? r[1] : null);
    else tables.push({ name: sh.name, header: rows[0].map(h => h ?? ''), rows: rows.slice(1) });
  }
  if (!tables.length && !Object.keys(kv).length) throw new Error('Faylda ma’lumot topilmadi.');

  $('title').textContent = kv['Report'] ? 'Annotatsiya hisoboti — ' + trValue(kv['Report']) : fileName;
  $('subtitle').textContent = fileName + (kv['Generated'] ? ' · yaratilgan: ' + kv['Generated'] : '');
  drop.classList.add('hidden'); $('privacy').classList.add('hidden');
  $('another').classList.remove('hidden'); $('report').classList.remove('hidden');

  const skip = new Set(['Report', 'Generated']);
  $('cards').innerHTML = Object.entries(kv).filter(([k]) => !skip.has(k)).map(([k, v]) =>
    '<div class="card"><div class="k">' + esc(tr(k)) + '</div><div class="v' + (typeof v === 'number' ? '' : ' small') + '">' +
    (v === null || v === '' ? '—' : esc(fmt(v))) + '</div></div>').join('');

  const assigned = kv['Corpus assigned'], done = kv['Corpus done'];
  if (typeof assigned === 'number' && typeof done === 'number' && assigned > 0) {
    const p = done / assigned * 100;
    $('progressBar').style.width = Math.min(p, 100) + '%';
    $('progressMeta').innerHTML = '<span><b>' + p.toFixed(1) + '%</b> bajarildi</span><span>' + fmt(done) + ' / ' + fmt(assigned) +
      ' · ' + fmt(kv['Corpus remaining'] ?? assigned - done) + ' qoldi</span>';
    $('progressPanel').classList.remove('hidden');
  } else $('progressPanel').classList.add('hidden');

  tables.forEach(prepare);
  $('tabs').innerHTML = tables.length > 1 ? tables.map((t, i) => '<button class="tab" data-i="' + i + '">' + esc(tr(t.name)) + '</button>').join('') : '';
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => selectTable(+b.dataset.i));
  setupTop();
  setupExport(fileName);
  selectTable(0);
}

function prepare(t) {
  // Hide columns that are empty in every row (e.g. Δ and CER in all-time reports).
  t.visible = t.header.map((h, c) => t.rows.some(r => r[c] !== null && r[c] !== undefined && r[c] !== ''));
  t.numeric = t.header.map((h, c) => t.rows.some(r => typeof r[c] === 'number') && !t.rows.some(r => typeof r[c] === 'string' && r[c] !== ''));
  // "% done" may be stored as 0..1 or 0..100
  t.pctScale = t.header.map((h, c) => isPctHeader(h) && t.numeric[c] && Math.max(...t.rows.map(r => r[c] ?? 0)) <= 1 ? 100 : 1);
  t.nameCol = t.header.findIndex((h, c) => t.visible[c] && !t.numeric[c]);
}

const findCol = (t, re) => t.header.findIndex((h, c) => t.visible[c] && t.numeric[c] && re.test(String(h)));

/* ---------- Top 10 with a metric switch (Clips / Hours / % done ...) ---------- */

function setupTop() {
  const t = tables[0];
  if (!t || t.nameCol < 0) { $('topPanel').classList.add('hidden'); return; }
  const preferred = [/^clips$/i, /^hours$/i, /%/, /^done$/i];
  let metrics = preferred.map(re => findCol(t, re)).filter(c => c >= 0);
  if (!metrics.length) metrics = t.header.map((h, c) => c).filter(c => t.visible[c] && t.numeric[c]).slice(0, 4);
  if (!metrics.length) { $('topPanel').classList.add('hidden'); return; }
  topCol = metrics[0];
  $('topMetric').innerHTML = metrics.map(c => '<button data-c="' + c + '">' + esc(tr(t.header[c])) + '</button>').join('');
  $('topMetric').querySelectorAll('button').forEach(b => b.onclick = () => { topCol = +b.dataset.c; drawTop(); });
  $('topPanel').classList.remove('hidden');
  drawTop();
}

function drawTop() {
  const t = tables[0], col = topCol;
  $('topMetric').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.c === col));
  const scale = t.pctScale[col];
  // For %, rank by percentage and then by amount done so tiny 100% annotators don't crowd the list.
  const doneCol = findCol(t, /^done$/i);
  const top = t.rows.filter(r => typeof r[col] === 'number')
    .sort((a, b) => (b[col] - a[col]) || (doneCol >= 0 ? (b[doneCol] ?? 0) - (a[doneCol] ?? 0) : 0)).slice(0, 10);
  const max = isPctHeader(t.header[col]) ? 100 : (top.length ? top[0][col] || 1 : 1);
  $('topTitle').textContent = 'Top 10 — ' + tr(t.header[col]) + ' bo‘yicha';
  $('top').innerHTML = top.map(r => {
    const v = r[col] * scale;
    const label = isPctHeader(t.header[col]) ? v.toFixed(1) + '%' : fmt(r[col]);
    return '<div class="row"><div class="name" title="' + esc(r[t.nameCol] ?? '') + '">' + esc(r[t.nameCol] ?? '') +
      '</div><div class="bar"><i style="width:' + Math.min(v / max * 100, 100) + '%"></i></div><div class="num">' + label + '</div></div>';
  }).join('');
}

/* ---------- Download annotators with Hours >= N as a new .xlsx ---------- */

let exportFileName = '';

function setupExport(fileName) {
  exportFileName = fileName;
  const t = tables[0];
  const ok = t && findCol(t, /^hours$/i) >= 0;
  $('exportPanel').classList.toggle('hidden', !ok);
  if (ok) updateExportCount();
}

function minHours() {
  const v = parseFloat(String($('minHours').value).replace(',', '.'));
  return isNaN(v) ? 2 : v;
}

function exportRows() {
  const t = tables[0], h = findCol(t, /^hours$/i), min = minHours();
  return t.rows.filter(r => typeof r[h] === 'number' && r[h] >= min).sort((a, b) => b[h] - a[h]);
}

function updateExportCount() {
  const n = exportRows().length;
  $('exportCount').innerHTML = 'Soati <b>' + minHours().toFixed(2) + '</b> va undan ko‘p: <b>' + n + '</b> ta annotator';
  $('exportBtn').disabled = n === 0;
}

$('minHours').oninput = updateExportCount;
$('exportBtn').onclick = () => {
  const t = tables[0], cols = t.header.map((h, c) => c).filter(c => t.visible[c]);
  const blob = buildXlsx('2 soatdan ko‘p'.replace('2', minHours().toFixed(2).replace(/[.]?0+$/, '')),
    cols.map(c => tr(t.header[c])), exportRows().map(r => cols.map(c => r[c])),
    cols.map(c => /^hours$/i.test(t.header[c]) ? 2 : isPctHeader(t.header[c]) ? 3 : 0));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportFileName.replace(/[.]xlsx$/i, '') + '-' + minHours().toFixed(2) + '-soat-va-kop.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/** Packs text files into an uncompressed .zip (an .xlsx is a zip of XML files). */
function zipFiles(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0, count = 0;
  for (const [name, text] of Object.entries(files)) {
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(12, 33, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(14, 33, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), nb);
    offset += 30 + nb.length + data.length; count++;
  }
  const size = central.reduce((s, a) => s + a.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, count, true); e.setUint16(10, count, true);
  e.setUint32(12, size, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/** Builds a one-sheet .xlsx. styles[i]: 0 = normal, 2 = 0.00, 3 = 0.0 */
function buildXlsx(sheetName, header, rows, styles) {
  const x = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const col = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const cell = (v, ref, style) => {
    if (v === null || v === undefined || v === '') return '';
    if (typeof v === 'number') return '<c r="' + ref + '"' + (style ? ' s="' + style + '"' : '') + '><v>' + v + '</v></c>';
    return '<c r="' + ref + '" t="inlineStr"' + (style ? ' s="' + style + '"' : '') + '><is><t xml:space="preserve">' + x(v) + '</t></is></c>';
  };
  const all = [header, ...rows];
  const sheetRows = all.map((r, i) => '<row r="' + (i + 1) + '">' +
    r.map((v, c) => cell(v, col(c) + (i + 1), i === 0 ? 1 : styles[c])).join('') + '</row>').join('');
  const widths = header.map((h, c) => Math.min(45, Math.max(8, ...all.map(r => String(r[c] ?? '').length)) + 2));
  const ns = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  const nsR = 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  return zipFiles({
    '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ' + ns + ' ' + nsR + '><sheets><sheet name="' + x(sheetName.slice(0, 31)) + '" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet ' + ns + '>' +
      '<numFmts count="1"><numFmt numFmtId="164" formatCode="0.0"/></numFmts>' +
      '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
      '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
      '<xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
    'xl/worksheets/sheet1.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ' + ns + '>' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<cols>' + widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>' +
      '<sheetData>' + sheetRows + '</sheetData></worksheet>'
  });
}

/* ---------- Table with search and "Sort by" ---------- */

function selectTable(i) {
  current = i; $('search').value = '';
  $('tabs').querySelectorAll('.tab').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  const t = tables[i];
  if (!t) { $('thead').innerHTML = ''; $('tbody').innerHTML = ''; $('count').textContent = 'Jadvalda ma’lumot yo‘q'; return; }
  $('sortBy').innerHTML = '<option value="-1">Fayldagi tartib</option>' +
    t.header.map((h, c) => t.visible[c] ? '<option value="' + c + '">' + esc(tr(h)) + '</option>' : '').join('');
  setSort(-1, 1);
  const hidden = t.header.filter((h, c) => !t.visible[c]);
  $('note').textContent = hidden.length ? 'Yashirilgan bo‘sh ustunlar: ' + hidden.map(tr).join(', ') : '';
}

function setSort(col, dir) {
  const t = tables[current];
  sortCol = col;
  // Numbers default to highest first, text to A→Z.
  sortDir = dir !== undefined ? dir : (col >= 0 && t.numeric[col] ? -1 : 1);
  $('sortBy').value = String(col);
  $('sortDir').classList.toggle('hidden', col < 0);
  const numeric = col >= 0 && t.numeric[col];
  $('sortDir').textContent = numeric ? (sortDir < 0 ? '↓ Kattadan kichikka' : '↑ Kichikdan kattaga') : (sortDir > 0 ? '↑ A → Z' : '↓ Z → A');
  drawTable();
}

$('sortBy').onchange = () => setSort(+$('sortBy').value);
$('sortDir').onclick = () => setSort(sortCol, -sortDir);
$('search').oninput = drawTable;

function drawTable() {
  const t = tables[current]; if (!t) return;
  const q = $('search').value.trim().toLowerCase();
  let rows = t.rows;
  if (q) rows = rows.filter(r => r.some(c => c !== null && String(c).toLowerCase().includes(q)));
  if (sortCol >= 0) rows = [...rows].sort((a, b) => {
    const x = a[sortCol], y = b[sortCol];
    const ex = x === null || x === undefined || x === '', ey = y === null || y === undefined || y === '';
    if (ex || ey) return ex === ey ? 0 : (ex ? 1 : -1); // empty values always last
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir;
  });

  $('thead').innerHTML = '<tr><th class="num">#</th>' + t.header.map((h, c) => !t.visible[c] ? '' :
    '<th data-c="' + c + '" class="' + (t.numeric[c] ? 'num ' : '') + (sortCol === c ? 'sorted' : '') + '">' + esc(tr(h)) +
    (sortCol === c ? (sortDir > 0 ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr>';
  $('thead').querySelectorAll('th[data-c]').forEach(th => th.onclick = () => {
    const c = +th.dataset.c;
    sortCol === c ? setSort(c, -sortDir) : setSort(c);
  });

  $('tbody').innerHTML = rows.map((r, n) => '<tr><td class="rank num">' + (n + 1) + '</td>' + t.header.map((h, c) => {
    if (!t.visible[c]) return '';
    const v = r[c], cls = (t.numeric[c] ? 'num ' : '') + (sortCol === c ? 'sorted' : '');
    if (isPctHeader(h) && typeof v === 'number') {
      const p = v * t.pctScale[c], color = p >= 90 ? 'good' : p >= 50 ? 'warn' : 'bad';
      return '<td class="' + cls + '"><div class="pct"><span>' + p.toFixed(1) + '%</span><div class="bar"><i class="' + color +
        '" style="width:' + Math.min(p, 100) + '%"></i></div></div></td>';
    }
    return '<td class="' + cls + '">' + esc(fmt(v)) + '</td>';
  }).join('') + '</tr>').join('');
  $('count').textContent = rows.length + ' / ' + t.rows.length + ' ta qator';
}
